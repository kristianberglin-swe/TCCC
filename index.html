*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px Arial,sans-serif;color:#fff;display:grid;place-items:center;background:#283428;position:relative}
body:before{content:"";position:fixed;inset:-12px;background:url('bilder/m90-ripstop-material.png') center/cover;filter:blur(6px) brightness(.46);z-index:-1}
.wrap{max-width:980px;width:calc(100% - 32px);padding:34px 0}

.patchwrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}.option:hover img{transform:scale(1.035)}
.go{margin-top:14px;font-weight:900;letter-spacing:1.5px;font-size:15px}.asm .go{color:#ff7b83}.cls .go{color:#71bde5}
.small{text-align:center;color:#e4e6df;font-size:12px;margin-top:26px}
