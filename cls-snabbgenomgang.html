<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLS – Snabbgenomgång</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f7f6ef;background:#121915}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#34463a,#101612 72%)}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.top a{color:#f5e7ba;text-decoration:none}.pill{border:1px solid #8b9a86;border-radius:30px;padding:8px 12px;font-size:12px;letter-spacing:2px}.screen{position:relative;overflow:hidden;border-radius:18px;aspect-ratio:16/9;background:#202922;margin-top:18px;box-shadow:0 24px 80px #0009}.scene{position:absolute;inset:0;display:grid;grid-template-columns:47% 53%;background:linear-gradient(115deg,#192b24,#283e34);opacity:0;transition:opacity .7s}.scene.active{opacity:1}.scene .visual{background:#f6f4ef;display:flex;align-items:center;justify-content:center;overflow:hidden}.scene img{width:100%;height:100%;object-fit:cover;animation:zoom 18s ease-in-out both}.scene .words{display:flex;flex-direction:column;justify-content:center;padding:6%;gap:18px}.stage{font-size:clamp(12px,1.6vw,18px);letter-spacing:3px;color:#e4bd78;font-weight:800}.scene h1{font-size:clamp(30px,4.5vw,58px);line-height:1.04;margin:0}.scene p{font-size:clamp(16px,1.8vw,24px);line-height:1.45;margin:0;max-width:540px}.counter{position:absolute;right:18px;bottom:15px;background:#0008;padding:8px 13px;border-radius:20px}.march{position:absolute;left:20px;top:17px;display:flex;gap:5px}.march span{background:#101b18a8;padding:8px 12px;border-radius:8px;font-weight:800}.march .on{background:#dfb66e;color:#171d19}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}.controls button,.controls select{background:#2a4034;border:1px solid #708875;border-radius:10px;color:white;padding:13px 17px;font-size:15px;cursor:pointer}.controls button.primary{background:#e3b56e;color:#172119;font-weight:bold}.controls button:focus-visible{outline:3px solid #fff}.progress{height:6px;background:#3a4b40;border-radius:6px;margin-top:15px;overflow:hidden}.progress div{height:100%;width:0;background:#e3b56e;transition:width .2s}.note{color:#c2cfc5;font-size:13px;line-height:1.5;margin-top:15px}.timeline{display:flex;gap:5px;margin-top:12px}.timeline button{flex:1;min-width:0;background:#27362d;border:1px solid #536357;color:#fff;border-radius:5px;padding:8px 2px;cursor:pointer;font-size:12px}.timeline button.selected{background:#d6b17b;color:#1a241c}@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.055)}}@media(max-width:650px){.screen{aspect-ratio:auto;height:630px}.scene{grid-template-columns:1fr;grid-template-rows:45% 55%}.scene .words{padding:22px}.march{top:8px;left:8px}.march span{padding:5px 8px}.scene p{font-size:17px}.timeline{flex-wrap:wrap}.timeline button{flex:1 1 25%}}</style>

</head><body><div class="wrap"><header class="top"><div><div class="pill">TCCC · COMBAT LIFESAVER</div><h2>CLS – snabbgenomgång</h2></div><a href="cls.html">← Till CLS</a></header><main><div class="screen" id="screen"><div class="march" id="march"></div><div id="scene" class="scene active"><div class="visual" style="position:relative"><img id="picture" alt="Utbildningsbild"><div id="credit" style="position:absolute;left:10px;bottom:8px;background:#000a;color:#fff;padding:5px 8px;border-radius:5px;font-size:10px;max-width:92%"></div></div><div class="words"><div class="stage" id="stage"></div><h1 id="heading"></h1><p id="caption"></p></div></div><div class="counter" id="counter"></div></div><div class="progress"><div id="progress"></div></div><div class="controls"><button class="primary" id="play">▶ Spela</button><button id="prev">◀ Föregående</button><button id="next">Nästa ▶</button><button id="voice">🔊 Berättarröst: av</button><select id="speed" aria-label="Hastighet"><option value="1">Normal hastighet</option><option value="1.3">1,3×</option><option value="1.6">1,6×</option></select></div><div class="timeline" id="timeline"></div></main></div><script>
const slides=[
{"stage":"START","title":"Skadad person – börja systematiskt","voice":"När platsen är tillräckligt säker går du fram till den skadade. Skapa kontakt och påbörja en snabb, systematisk bedömning enligt MARCH. Livshotande problem åtgärdas direkt när de upptäcks.","img":"bilder/skadad_person.jpeg","fallback":"bilder/skadad_person.jpeg","credit":"Realistisk utbildningsbild – skadad person","sec":13},
{"stage":"M · MASSIVE BLEEDING","title":"Blodsvep","voice":"Börja med att leta efter massiv blödning. Genomför ett blodsvep och kontrollera systematiskt hals, armhålor, ljumskar och extremiteter. Titta även efter blod som samlats under den skadade.","img":"bilder/blodsvep.jpeg","fallback":"bilder/blodsvep.jpeg","credit":"Realistisk utbildningsbild – blodsvep","sec":15},
{"stage":"M · MASSIVE BLEEDING","title":"Tourniquet","voice":"Vid en livshotande extremitetsblödning används tourniquet enligt utbildningen. Dra åt tills blödningen upphör och notera tiden. Kontrollera därefter att åtgärden verkligen har effekt.","img":"bilder/tourniquet_realistisk.jpg","fallback":"bilder/tourniquet_1.png","credit":"Praktisk tourniquetapplicering · PennCare Tactical","sec":15},
{"stage":"M · MASSIVE BLEEDING","title":"Tamponering och tryckförband","voice":"När en tourniquet inte är lämplig kan såret behöva tamponeras. Packa såret enligt utbildningen, håll direkt tryck och säkra därefter med tryckförband. Kontrollera att blödningen är stoppad.","img":"bilder/sarpackning.png","fallback":"bilder/sarpackning.png","credit":"Realistisk utbildningsbild – sårpackning","sec":17},
{"stage":"A · AIRWAY","title":"Kontrollera luftvägen","voice":"Kontrollera om den skadade kan prata och om luftvägen är fri. Om personen inte kan hålla luftvägen öppen, använd de luftvägsåtgärder som ingår i CLS-utbildningen och omvärdera efter åtgärden.","img":"bilder/kontrollera_luftvagen.png","fallback":"bilder/kontrollera_luftvagen.png","credit":"Realistisk utbildningsbild – kontrollera luftvägen","sec":16},
{"stage":"R · RESPIRATION","title":"Bedöm andning och bröstkorg","voice":"Bedöm andningen och undersök bröstkorgen. Leta efter penetrerande bröstskador och andra tecken på försämrad andning. Åtgärda enligt CLS-utbildningen och fortsätt att omvärdera.","img":"bilder/bedom_andning_brostkorg.png","fallback":"bilder/bedom_andning_brostkorg.png","credit":"Realistisk utbildningsbild – bedöm andning och bröstkorg","sec":17},
{"stage":"C · CIRCULATION","title":"Bedöm blödningschock","voice":"Bedöm tecken på blödningschock. Var uppmärksam på snabb andning, förvirring eller sänkt medvetande, kallsvettig blek hud och svag eller utebliven handledspuls. Kontrollera samtidigt att tidigare blödningsåtgärder fortfarande fungerar.","img":"bilder/bedom_blodningschock.jpg","fallback":"bilder/bedom_blodningschock.jpg","credit":"Realistisk utbildningsbild – bedöm blödningschock","sec":17},
{"stage":"H · HYPOTHERMIA","title":"Förhindra avkylning","voice":"Traumapatienter kyls snabbt ned. Isolera den skadade från marken och skydda mot vind, väta och kyla. Använd värmebevarande utrustning enligt utbildningen och håll personen varm under resten av omhändertagandet.","img":"bilder/forhindra_avkylning.jpeg","fallback":"bilder/forhindra_avkylning.jpeg","credit":"Realistisk utbildningsbild – förhindra avkylning","sec":15},
{"stage":"PAWS","title":"Övriga skador","voice":"När de omedelbart livshotande problemen är hanterade fortsätter du med övriga skador. Kontrollera bland annat frakturer, brännskador och ögonskador och ge övrig behandling enligt CLS-utbildningen och din behörighet.","img":"bilder/ovriga_skador.jpg","fallback":"bilder/ovriga_skador.jpg","credit":"Realistisk utbildningsbild – övriga skador","sec":15},
{"stage":"TACEVAC","title":"Dokumentera och förbered avtransport","voice":"Dokumentera fynd och åtgärder, inklusive tourniquettider. Förbered den skadade för transport och lämna en tydlig rapport. Omvärdera hela MARCH före och under avtransporten.","img":"bilder/dokumentera.jpg","fallback":"bilder/dokumentera.jpg","credit":"TCCC casualty card – dokumentation","sec":16}
];
let index=0,playing=false,voice=false,timer=null,started=0,remaining=0;const $=id=>document.getElementById(id);const timeline=$('timeline');slides.forEach((s,i)=>{const b=document.createElement('button');b.textContent=['Start','Blodsvep','Tourniquet','Tamponering','Airway','Respiration','Chock','Hypotermi','PAWS','Avtransport'][i];b.onclick=()=>show(i);timeline.append(b)});function speak(){if(!voice||!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(slides[index].voice);u.lang='sv-SE';u.rate=Number($('speed').value)*.98;speechSynthesis.speak(u)}function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel()}function show(i){clearTimeout(timer);stopSpeech();index=(i+slides.length)%slides.length;const s=slides[index];$('scene').classList.remove('active');setTimeout(()=>{$('picture').onerror=()=>{if(s.fallback && $('picture').src.indexOf(s.fallback)===-1){$('picture').onerror=null;$('picture').src=s.fallback}};$('picture').src=s.img;$('stage').textContent=s.stage;$('heading').textContent=s.title;$('caption').textContent=s.voice;$('credit').textContent=s.credit||'';$('counter').textContent=(index+1)+' / '+slides.length;$('march').innerHTML=['M','A','R','C','H','PAWS'].map(x=>'<span class="'+(s.stage.startsWith(x)?'on':'')+'">'+x+'</span>').join('');[...timeline.children].forEach((b,n)=>b.classList.toggle('selected',n===index));$('progress').style.width=(index/slides.length*100)+'%';$('scene').classList.add('active');if(playing){speak();timer=setTimeout(advance,s.sec*1000/Number($('speed').value))}},240)}function advance(){if(index===slides.length-1){pause();$('progress').style.width='100%';return}show(index+1)}function pause(){playing=false;clearTimeout(timer);stopSpeech();$('play').textContent='▶ Spela'}$('play').onclick=()=>{if(playing){pause()}else{playing=true;$('play').textContent='Ⅱ Pausa';show(index)}};$('prev').onclick=()=>show(Math.max(0,index-1));$('next').onclick=()=>show(Math.min(slides.length-1,index+1));$('voice').onclick=()=>{voice=!voice;$('voice').textContent=voice?'🔊 Berättarröst: på':'🔇 Berättarröst: av';if(playing){if(voice)speak();else stopSpeech()}};$('speed').onchange=()=>{if(playing)show(index)};show(0);
</script></body></html>
